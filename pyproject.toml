[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chap-benchmarking"
version = "0.2.0"
description = "Run the standing CHAP model benchmarks against a chap-core instance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "cyclopts>=2.0.0",
]

[project.scripts]
run-benchmarks = "run_benchmarks:main"
seed-datasets = "seed_datasets:main"
check-updates = "check_updates_and_trigger_run:main"

[tool.setuptools]
py-modules = [
    "chap_client",
    "run_benchmarks",
    "seed_datasets",
    "check_updates_and_trigger_run",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
