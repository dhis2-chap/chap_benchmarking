# One entry per standing benchmark problem. The name is the human-chosen label used
# by this repo and the marketplace; chap-core knows nothing about it.
#
# backtest_params mirrors chap-core's BacktestParams. chap-core deduplicates
# (dataset, backtest_params) into one BacktestSpecification, so every backtest a
# problem produces is comparable by construction. Do not change a problem's
# parameters in place: that would start a new specification and orphan the old
# results. Add a new problem instead.
#
# models are configured model names as registered in chap-core. A model is run
# when it has no backtest under the problem's specification, so registering a new
# model version in chap-core is what triggers a run for it.

- name: rwanda_monthly
  dataset_name: rwanda_evaluation_set
  backtest_params:
    n_periods: 3     # forecast horizon, in periods
    n_splits: 2      # number of rolling train/test splits
    stride: 1
    n_retrain: 1
    # future_weather_provider: climatology   # omit to use chap-core's default
  models:
    - naive_model
    - chap_ewars_monthly
